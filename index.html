<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tablero de Fallas · Máquina Mala por Día y Línea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#002B49; --panel:#013A5E; --panel2:#024A73; --line:#0A567E;
    --text:#43AF2A; --dim:#9FC3D6; --amber:#f5a524; --red:#ef4444; --green:#43AF2A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;
    height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{flex:none;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;
    justify-content:space-between;background:linear-gradient(180deg,var(--panel),var(--bg))}
  h1{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;margin:0;line-height:1}
  .logo{height:50px;width:auto;display:block}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
    background:var(--panel2);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
  .statusbar{flex:none;padding:8px 22px;font-size:11px;color:var(--dim);display:flex;gap:18px;
    align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .wrap{flex:1;min-height:0;padding:16px 22px;display:flex;flex-direction:column;gap:14px}
  .kpis{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-family:'Oswald',sans-serif;font-weight:700;margin-top:4px;line-height:1}
  .kpi .subv{font-size:11px;color:var(--dim);margin-top:4px}
  .content{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
    display:flex;flex-direction:column;min-height:0}
  .card h2{flex:none;font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;
    letter-spacing:1px;margin:0 0 12px}
  .fill{flex:1;min-height:0;overflow:auto}
  .rightcol{min-height:0;display:flex;flex-direction:column;gap:14px}
  .rightcol .card{flex:1}
  #paretoBox,#weeklyBox{flex:1;min-height:0;position:relative}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--panel)}
  .scroll{overflow:auto}
  /* Matriz profesional */
  .matx{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .matx thead th{background:linear-gradient(180deg,#024A73,#013A5E);color:var(--text);
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.6px;font-size:11px;
    font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  .matx thead th:first-child{text-align:left}
  .matx tbody td{padding:11px 14px;text-align:center;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;transition:filter .15s}
  .matx tbody tr:last-child td{border-bottom:none}
  .matx .lcol{text-align:left;font-weight:600;color:var(--text);
    position:sticky;left:0;background:var(--panel);border-right:1px solid var(--line)}
  .matx .tot{font-weight:700;color:var(--amber);background:rgba(245,165,36,.07)}
  .matx tbody tr:hover td{filter:brightness(1.15)}
  .matx .totalrow td{background:#012740;font-weight:700;color:var(--amber);border-top:1px solid var(--line)}
  .matx .totalrow .lcol{background:#012740}
  .err{color:var(--red)}

  /* ===== Escalado en pantallas grandes (manteniendo una sola pantalla) ===== */
  @media (min-width:1500px){
    header{padding:18px 40px}
    .statusbar{padding:12px 40px;font-size:14px;gap:26px}
    .dot{width:12px;height:12px}
    h1{font-size:34px;letter-spacing:1.5px}
    .logo{height:72px}
    .sub{font-size:15px}
    .badge{font-size:14px;padding:8px 14px}
    .wrap{padding:22px 40px;gap:20px}
    .kpis{gap:20px}
    .kpi{padding:18px 22px}
    .kpi .lbl{font-size:15px}
    .kpi .val{font-size:48px}
    .kpi .subv{font-size:15px}
    .content{gap:20px}
    .card{padding:22px 26px}
    .card h2{font-size:20px;margin:0 0 16px}
    .matx{font-size:18px}
    .matx thead th{font-size:15px;padding:14px 18px}
    .matx tbody td{padding:14px 18px}
  }
  @media (min-width:2400px){  /* 4K */
    h1{font-size:46px}
    .kpi .val{font-size:68px}
    .matx{font-size:24px}
    .matx thead th{font-size:19px;padding:18px 22px}
    .matx tbody td{padding:18px 22px}
    .card h2{font-size:26px}
  }
</style>
</head>

// ====== CONFIGURACIÓN ======
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDfzsKuj9Vn6eBYhkHM89hWBp3CTM4lL7I1Ia1eVweZKGosuBRvzheWMLIWUZTqKD3UxtM1cR5lLOf/pub?output=csv";
const REFRESH_SECONDS = 60;
// Si la autodetección falla, fija los nombres aquí (ej. "Fecha", "Linea"):
let DATE_COL = "";   // se autodetecta
let LINE_COL = "";   // se autodetecta
const FILTER_COL = ""; // opcional, ej. "Estatus"
const FILTER_VAL = ""; // opcional, ej. "Falla"
// ============================

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const guess = (hdrs, kws) => hdrs.find(h => kws.some(k => norm(h).includes(k))) || "";

// Orden y colores de los días de la semana.
const WEEKDAYS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const WD_COLORS = {Lun:"#f5a524",Mar:"#fbbf24",Mié:"#34d399",Jue:"#60a5fa",Vie:"#a78bfa",Sáb:"#f472b6",Dom:"#ef4444"};
const WD_FULL = {Lun:"Lunes",Mar:"Martes",Mié:"Miércoles",Jue:"Jueves",Vie:"Viernes",Sáb:"Sábado",Dom:"Domingo"};

// Convierte un texto de fecha en día de la semana (Lun…Dom). Soporta varios formatos.
// Convierte texto de fecha (americano m/d/aaaa o ISO) a objeto Date.
function parseDate(str){
  let s = String(str).trim();
  if(!s) return null;
  // Quitar parte de hora si existe ("03/06/2026 13:24:23" -> "03/06/2026")
  s = s.split(/[ T]/)[0];
  // Formato LATINO con barra: d/m/aaaa (acepta también d-m-aaaa)
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const d=new Date(y,(+m[2])-1,+m[1]); return isNaN(d)?null:d; }
  // Formato ISO aaaa-mm-dd (interpretar como fecha local, no UTC)
  let iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso){ const d=new Date(+iso[1],(+iso[2])-1,+iso[3]); return isNaN(d)?null:d; }
  const t = new Date(s);
  return isNaN(t) ? null : t;
}

// Muestra la fecha en formato latino dd/mm/aaaa (la lectura sigue siendo americana).
function formatLatino(str){
  const dt = parseDate(str);
  if(!dt) return str;
  const dd = String(dt.getDate()).padStart(2,"0");
  const mm = String(dt.getMonth()+1).padStart(2,"0");
  return `${dd}/${mm}/${dt.getFullYear()}`;
}

function weekdayOf(str){
  const dt = parseDate(str);
  if(!dt) return null;
  // getDay(): 0=Dom … 6=Sáb  ->  índice en WEEKDAYS (0=Lun)
  return WEEKDAYS[(dt.getDay()+6)%7];
}

// Lunes (00:00) de la semana a la que pertenece la fecha.
function weekStart(dt){
  const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const off = (d.getDay()+6)%7; // 0=lun
  d.setDate(d.getDate()-off);
  d.setHours(0,0,0,0);
  return d;
}
function ddmm(dt){ return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0"); }
// Número de semana ISO-8601 (la semana 1 es la que contiene el primer jueves del año).
function isoWeek(dt){
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;        // 0=lun
  d.setUTCDate(d.getUTCDate()-dayNum+3);      // jueves de esa semana
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const fDay = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fDay+3);
  return 1 + Math.round((d-firstThu)/(7*86400000));
}
let chart = null;
let chart2 = null;
let hasGoodData = false;

function setStatus(state, msg){
  const dot = document.getElementById("dot");
  const txt = document.getElementById("statusTxt");
  if(state==="error"){ dot.style.background="var(--red)"; txt.textContent="Error de conexión"; }
  else if(state==="loading"){ dot.style.background="var(--amber)"; txt.textContent="Actualizando…"; }
  else { dot.style.background="var(--green)"; txt.textContent="En línea"; }
  document.getElementById("errTxt").textContent = msg || "";
}

async function load(){
  setStatus("loading");
  try{
    const res = await fetch(CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();

    // Validar que sea CSV real y no una página de error/redirección de Google.
    if(/^\s*</.test(text) || /<html/i.test(text.slice(0,200))){
      throw new Error("Respuesta no válida (la hoja respondió HTML). Reintentando…");
    }

    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    const headers = parsed.meta.fields || [];
    let rows = parsed.data.filter(r => Object.values(r).some(v => v!==""));

    if(!DATE_COL) DATE_COL = guess(headers, ["fecha","dia","date","day"]);
    if(!LINE_COL) LINE_COL = guess(headers, ["linea","line","celda","estacion"]);

    if(!DATE_COL || !LINE_COL || !headers.includes(DATE_COL) || !headers.includes(LINE_COL)){
      // No tocar lo que ya está pintado; solo avisar.
      if(!hasGoodData) setStatus("error", "No identifiqué las columnas. Encabezados: " + headers.join(", "));
      else setStatus("ok");
      return;
    }
    if(FILTER_COL && FILTER_VAL){
      rows = rows.filter(r => norm(r[FILTER_COL]||"").trim() === norm(FILTER_VAL).trim());
    }

    // Si esta lectura viene vacía pero ya teníamos datos buenos, NO borrar la pantalla.
    const usable = rows.filter(r => String(r[DATE_COL]||"").trim() && String(r[LINE_COL]||"").trim());
    if(usable.length === 0 && hasGoodData){
      setStatus("ok");
      return;
    }

    render(usable);
    if(usable.length > 0) hasGoodData = true;
    setStatus("ok");
    document.getElementById("lastUpd").textContent = "Última actualización: " + new Date().toLocaleTimeString("es-MX");
    document.getElementById("refreshTxt").textContent = "Auto-refresco cada " + REFRESH_SECONDS + "s";
  }catch(e){
    // En error de red: conservar lo último bueno, solo marcar estado.
    setStatus(hasGoodData ? "ok" : "error", hasGoodData ? "" : e.message);
  }
}

function render(rows){
  // --- Semana actual (lunes a domingo) ---
  const now = new Date();
  const cws = weekStart(now);
  const cwe = new Date(cws); cwe.setDate(cws.getDate()+7);

  // Histórico: total de eventos por semana (todos los datos).
  const weekMap = {};
  for(const r of rows){
    const d = String(r[DATE_COL]||"").trim();
    const l = String(r[LINE_COL]||"").trim();
    if(!d || !l) continue;
    const dt = parseDate(d); if(!dt) continue;
    const ws = weekStart(dt); const key = ws.getTime();
    (weekMap[key] = weekMap[key] || {start:ws, count:0}).count++;
  }

  // Solo filas de la semana actual para la matriz, la gráfica de días y los KPIs.
  const weekRows = rows.filter(r=>{
    const dt = parseDate(String(r[DATE_COL]||"").trim());
    return dt && dt>=cws && dt<cwe;
  });

  // Etiquetas de rango de la semana actual.
  const cwEnd = new Date(cws); cwEnd.setDate(cws.getDate()+6);
  const rangeTxt = `Semana actual: ${ddmm(cws)} – ${ddmm(cwEnd)}`;
  document.getElementById("matTitle").textContent = "Matriz: línea × día — " + rangeTxt;
  document.getElementById("dayTitle").textContent = "Eventos por día — " + rangeTxt;

  const matrix = {}, lineSet = new Set(), dateSet = new Set();
  const byLineWd = {}; // linea -> {Lun:n, Mar:n, ...}
  const wdPresent = new Set();
  for(const r of weekRows){
    const d = String(r[DATE_COL]||"").trim();
    const l = String(r[LINE_COL]||"").trim();
    if(!d || !l) continue;
    dateSet.add(d); lineSet.add(l);
    (matrix[d] = matrix[d] || {});
    matrix[d][l] = (matrix[d][l]||0) + 1;
    const wd = weekdayOf(d) || "S/F";
    wdPresent.add(wd);
    (byLineWd[l] = byLineWd[l] || {});
    byLineWd[l][wd] = (byLineWd[l][wd]||0) + 1;
  }
  const dates = [...dateSet].sort((a,b)=>{
    const da=parseDate(a), db=parseDate(b);
    if(da&&db) return da-db;
    return String(a).localeCompare(String(b));
  });
  const lines = [...lineSet];
  const lineTotals = {}, dateTotals = {};
  lines.forEach(l => lineTotals[l] = dates.reduce((s,d)=>s+(matrix[d]?.[l]||0),0));
  // Ordenar líneas de mayor a menor por cantidad de eventos (empate -> alfabético).
  lines.sort((a,b)=> (lineTotals[b]-lineTotals[a]) || a.localeCompare(b));
  dates.forEach(d => dateTotals[d] = lines.reduce((s,l)=>s+(matrix[d]?.[l]||0),0));
  const grand = Object.values(lineTotals).reduce((a,b)=>a+b,0);
  const worstLine = lines.reduce((a,l)=>lineTotals[l]>(lineTotals[a]||-1)?l:a, lines[0]);
  const worstDay  = dates.reduce((a,d)=>dateTotals[d]>(dateTotals[a]||-1)?d:a, dates[0]);
  const maxCell = Math.max(1, ...dates.flatMap(d=>lines.map(l=>matrix[d]?.[l]||0)));
  const heat = v => v ? `rgba(239,68,68,${0.12 + (v/maxCell)*0.78})` : "transparent";

  // KPIs
  const kpi = (lbl,val,sub,color,small)=>`<div class="kpi" style="border-left:3px solid ${color}">
    <div class="lbl">${lbl}</div>
    <div class="val" style="font-size:${small?22:34}px;color:${color}">${val}</div>
    ${sub?`<div class="subv">${sub}</div>`:""}</div>`;
  const worstDayLabel = worstDay ? `${formatLatino(worstDay)}${weekdayOf(worstDay)?" · "+(WD_FULL[weekdayOf(worstDay)]):""}` : "—";
  document.getElementById("kpis").innerHTML =
    kpi("Total de fallas", grand, "", "var(--amber)") +
    kpi("Línea más afectada", worstLine||"—", worstLine?lineTotals[worstLine]+" fallas":"", "var(--red)", true) +
    kpi("Día más afectado", worstDayLabel, worstDay?dateTotals[worstDay]+" fallas":"", "var(--red)", true) +
    kpi("Líneas monitoreadas", lines.length, "", "var(--green)");

  // Matriz línea × día de la semana (mapa de calor): líneas en vertical, días arriba.
  const usedDays = WEEKDAYS.filter(w => wdPresent.has(w));
  if(wdPresent.has("S/F")) usedDays.push("S/F");
  const wdTotalByLine = {};
  lines.forEach(l => wdTotalByLine[l] = usedDays.reduce((s,w)=>s+(byLineWd[l]?.[w]||0),0));
  const wdColTotal = {};
  usedDays.forEach(w => wdColTotal[w] = lines.reduce((s,l)=>s+(byLineWd[l]?.[w]||0),0));
  const wdMax = Math.max(1, ...lines.flatMap(l => usedDays.map(w => byLineWd[l]?.[w]||0)));
  const hot = v => v ? `rgba(239,68,68,${0.12 + (v/wdMax)*0.78})` : "transparent";

  let wh = "<table class='matx'><thead><tr><th>Línea</th>";
  usedDays.forEach(w => wh += `<th>${w==="S/F"?"Sin fecha":(WD_FULL[w]||w)}</th>`);
  wh += "<th>Total</th></tr></thead><tbody>";
  lines.forEach(l=>{
    wh += `<tr><td class="lcol">${l}</td>`;
    usedDays.forEach(w=>{
      const v = byLineWd[l]?.[w]||0;
      wh += `<td style="background:${hot(v)};font-weight:${v?700:400};color:${v?'#fff':'var(--line)'}">${v||'·'}</td>`;
    });
    wh += `<td class="tot">${wdTotalByLine[l]}</td></tr>`;
  });
  wh += `<tr class="totalrow"><td class="lcol">Total</td>`;
  usedDays.forEach(w => wh += `<td>${wdColTotal[w]}</td>`);
  wh += `<td>${grand}</td></tr></tbody></table>`;
  document.getElementById("wdMatrix").innerHTML = grand ? wh :
    "<div style='color:var(--dim);padding:20px;text-align:center'>Sin datos para mostrar.</div>";

  // Gráfica de columnas: total de eventos por DÍA DE LA SEMANA, con el valor encima.
  const chartDays = WEEKDAYS.filter(w => wdPresent.has(w));
  if(wdPresent.has("S/F")) chartDays.push("S/F");
  const dayLabels = chartDays.map(w => w==="S/F" ? "Sin fecha" : (WD_FULL[w]||w));
  const dayVals = chartDays.map(w => wdColTotal[w]||0);
  const maxVal = Math.max(...dayVals, 0);

  // Escala de fuentes para TV.
  const big = window.innerWidth >= 2400 ? 2 : (window.innerWidth >= 1500 ? 1.5 : 1);
  const valFont = Math.round(14*big), tickFont = Math.round(12*big);

  // Plugin para dibujar el número encima de cada columna.
  const valueLabels = {
    id:"valueLabels",
    afterDatasetsDraw(c){
      const {ctx} = c;
      const meta = c.getDatasetMeta(0);
      ctx.save();
      ctx.fillStyle = "#43AF2A";
      ctx.font = `600 ${valFont}px 'IBM Plex Mono', monospace`;
      ctx.textAlign = "center";
      meta.data.forEach((bar,i)=>{
        const v = dayVals[i];
        if(v!=null) ctx.fillText(v, bar.x, bar.y - 8);
      });
      ctx.restore();
    }
  };

  const pctx = document.getElementById("pareto");
  if(chart) chart.destroy();
  chart = new Chart(pctx, {
    type:"bar",
    data:{ labels:dayLabels, datasets:[{
      data:dayVals,
      backgroundColor: dayVals.map(v => v===maxVal && maxVal>0 ? "#ef4444" : "#f5a524"),
      borderRadius:4, maxBarThickness:90*big }]},
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:24*big } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>`${c.parsed.y} eventos` } } },
      scales:{
        x:{ ticks:{color:"#43AF2A",font:{size:tickFont}}, grid:{display:false} },
        y:{ beginAtZero:true, ticks:{color:"#9FC3D6",precision:0,stepSize:1,font:{size:tickFont}}, grid:{color:"#0A567E"} }
      }},
    plugins:[valueLabels]
  });

  // --- Gráfica lineal: eventos por semana (histórico) ---
  const wkKeys = Object.keys(weekMap).map(Number).sort((a,b)=>a-b);
  const wkLabels = wkKeys.map(k=> "Sem " + isoWeek(weekMap[k].start));
  const wkRanges = wkKeys.map(k=>{ const s=weekMap[k].start; const e=new Date(s); e.setDate(s.getDate()+6); return ddmm(s)+"–"+ddmm(e); });
  const wkVals = wkKeys.map(k=> weekMap[k].count);
  const curKey = cws.getTime();

  // Plugin para mostrar el número de fallos sobre cada punto.
  const weeklyLabels = {
    id:"weeklyLabels",
    afterDatasetsDraw(c){
      const {ctx} = c;
      const meta = c.getDatasetMeta(0);
      ctx.save();
      ctx.fillStyle = "#43AF2A";
      ctx.font = `600 ${valFont}px 'IBM Plex Mono', monospace`;
      ctx.textAlign = "center";
      meta.data.forEach((pt,i)=>{ ctx.fillText(wkVals[i], pt.x, pt.y - 12); });
      ctx.restore();
    }
  };

  const wctx = document.getElementById("weekly");
  if(chart2) chart2.destroy();
  chart2 = new Chart(wctx, {
    type:"line",
    data:{ labels:wkLabels, datasets:[{
      label:"Eventos por semana",
      data:wkVals,
      borderColor:"#60a5fa", backgroundColor:"rgba(96,165,250,.15)",
      borderWidth:2, fill:true, tension:0.25,
      pointRadius: wkKeys.map(k=> k===curKey ? 6 : 4),
      pointBackgroundColor: wkKeys.map(k=> k===curKey ? "#f5a524" : "#60a5fa"),
      pointBorderColor: wkKeys.map(k=> k===curKey ? "#f5a524" : "#60a5fa")
    }]},
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:26*big } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ title:items=>wkLabels[items[0].dataIndex]+" ("+wkRanges[items[0].dataIndex]+")", label:c=>`${c.parsed.y} eventos` } } },
      scales:{
        x:{ ticks:{color:"#9FC3D6",font:{size:tickFont}}, grid:{display:false},
            title:{display:true,text:"Número de semana",color:"#9FC3D6",font:{size:tickFont}} },
        y:{ beginAtZero:true, ticks:{color:"#9FC3D6",precision:0,font:{size:tickFont}}, grid:{color:"#0A567E"} }
      }},
    plugins:[weeklyLabels]
  });
}

load();
setInterval(load, Math.max(15, REFRESH_SECONDS)*1000);
</script>
